services:
  - type: web
    name: fraudguard-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/seed_demo_data.py"
    startCommand: "gunicorn -c gunicorn.conf.py run:app"
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: USE_PROXY_FIX
        value: "true"
      - key: NUM_PROXIES
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "2"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RISK_THRESHOLD_LOW
        value: "0.30"
      - key: RISK_THRESHOLD_HIGH
        value: "0.70"
      - key: DEMO_MODE
        value: "True"
      - key: ADMIN_PASSWORD
        sync: false
