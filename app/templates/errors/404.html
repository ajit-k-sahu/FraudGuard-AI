{% extends "base.html" %}

{% block title %}404 - Page Not Found - FraudGuard AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="fg-card p-5">
        <div class="display-1 text-info fw-bold mb-3">404</div>
        <h2 class="h3 fw-bold text-white mb-2">Resource Not Found</h2>
        <p class="text-secondary mb-4">
          The requested transaction record, telemetry page, or endpoint does not exist or has been archived.
        </p>
        <div class="d-flex justify-content-center gap-3">
          <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('dashboard.landing') }}" class="btn btn-primary-fg">
            <i class="bi bi-house-door me-1"></i> Return to Dashboard
          </a>
          <a href="{{ url_for('transactions.history') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-outline-fg">
            <i class="bi bi-clock-history me-1"></i> Transaction History
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
